- id: ru-diagnostic
  lang: ru
  order: 10
  question: Что происходит на бесплатной диагностике?
  answer: >-
    На онлайн-встрече преподаватель познакомится с ребёнком, комплексно оценит его знания, определит
    сильные стороны и основные пробелы. После диагностики мы обсудим с вами результаты и предложим
    подходящую программу и формат занятий.

- id: ru-choose
  lang: ru
  order: 20
  question: Нужно ли заранее выбирать формат занятий?
  answer: >-
    Нет. После диагностики мы предложим подходящий формат с учётом уровня ребёнка, его целей и
    вашего расписания.

- id: ru-language
  lang: ru
  order: 30
  question: На каком языке идут занятия?
  answer: Занятия в школе проходят на иврите, русском и английском языках.

- id: ru-price
  lang: ru
  order: 40
  question: Сколько стоят занятия?
  answer: >-
    Стоимость стартует от 100 ₪ за занятие. Подходящий формат и точную стоимость мы подскажем после
    диагностики.

- id: ru-online
  lang: ru
  order: 50
  question: Занятия только онлайн?
  answer: >-
    Да, сейчас все занятия проходят онлайн. Для урока нужен компьютер или планшет, стабильный
    интернет и тихое место.

- id: ru-materials
  lang: ru
  order: 60
  question: Нужно ли покупать материалы, чтобы заниматься?
  answer: >-
    Нет. Каталог материалов — отдельное предложение. Покупать тетради и наборы заданий можно без
    занятий, а заниматься — без покупки материалов.

- id: he-diagnostic
  lang: he
  order: 10
  question: מה קורה באבחון החינם?
  answer: >-
    בפגישה אונליין המורה מכיר את הילד, מעריך לעומק את הידע שלו ומזהה את החוזקות ואת הפערים
    העיקריים. אחרי האבחון נעבור אתכם על התוצאות ונציע תוכנית ומתכונת לימוד שמתאימות לו.

- id: he-choose
  lang: he
  order: 20
  question: צריך לבחור מראש את מתכונת הלימוד?
  answer: >-
    לא. אחרי האבחון נציע את המתכונת המתאימה לפי הרמה של הילד, המטרות שלו ולוח הזמנים שלכם.

- id: he-language
  lang: he
  order: 30
  question: באיזו שפה מתקיימים השיעורים?
  answer: השיעורים בבית הספר מתקיימים בעברית, ברוסית ובאנגלית.

- id: he-price
  lang: he
  order: 40
  question: כמה עולים השיעורים?
  answer: >-
    המחיר מתחיל ב־100 ₪ לשיעור. את המתכונת המתאימה ואת המחיר המדויק נגיד לכם אחרי האבחון.

- id: he-online
  lang: he
  order: 50
  question: השיעורים מתקיימים רק אונליין?
  answer: >-
    כן, כרגע כל השיעורים מתקיימים אונליין. לשיעור דרושים מחשב או טאבלט, חיבור אינטרנט יציב ומקום
    שקט.

- id: he-materials
  lang: he
  order: 60
  question: צריך לקנות חומרים כדי ללמוד?
  answer: >-
    לא. קטלוג החומרים הוא הצעה נפרדת. אפשר לקנות חוברות ומאגרי תרגילים בלי שיעורים, וללמוד בלי
    לקנות חומרים.

- id: en-diagnostic
  lang: en
  order: 10
  question: What happens at the free assessment?
  answer: >-
    In an online meeting the teacher gets to know your child, reviews their knowledge in full and
    identifies their strengths and main gaps. Afterwards we go through the results with you and
    suggest a programme and lesson format that suit them.

- id: en-choose
  lang: en
  order: 20
  question: Do we have to pick a lesson format in advance?
  answer: >-
    No. After the assessment we suggest the right format based on your child's level, their goals
    and your schedule.

- id: en-language
  lang: en
  order: 30
  question: Which language are lessons taught in?
  answer: Lessons at the school run in Hebrew, Russian and English.

- id: en-price
  lang: en
  order: 40
  question: How much do lessons cost?
  answer: >-
    Prices start from 100 ₪ per lesson. We tell you the right format and the exact price after the
    assessment.

- id: en-online
  lang: en
  order: 50
  question: Are lessons online only?
  answer: >-
    Yes, all lessons currently run online. Your child needs a computer or tablet, a stable internet
    connection and a quiet place.

- id: en-materials
  lang: en
  order: 60
  question: Do we need to buy materials to take lessons?
  answer: >-
    No. The materials catalogue is a separate offer. You can buy workbooks and task sets without
    lessons, and take lessons without buying materials.
